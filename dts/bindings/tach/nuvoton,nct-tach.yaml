description: Nuvoton NCT Multi-Function Timer (MFT) controller

compatible: "nuvoton,nct-tach"

include: base.yaml

properties:
  reg:
    required: true
  clocks:
    required: true
  tach-channel:
    type: int
    description: |
      Index of the MFT hardware module (1, 2, or 3).
      Do not override in board-level device trees.
